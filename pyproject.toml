[project]
name = "blank-app-template"
version = "0.1.0"
description = "A simple Streamlit app template."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.3,<4",
    "plotly>=7.1.0",
    "streamlit>=1.61.1",
]

[tool.uv]
package = false

[dependency-groups]
# only for scripts/build_data.py; the app itself doesn't use FastF1
data = [
    "fastf1>=3.9.2",
]
